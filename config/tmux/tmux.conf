# : << 'EOF'

setenv -g PATH "$HOME/.bin:$PATH"

run '~/.config/tmux/session-manager.sh restore'
set-hook -g window-layout-changed 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g session-window-changed 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g session-created 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g client-detached 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g window-renamed 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g after-split-window 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g after-new-window 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g pane-exited 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g session-renamed 'run -b "~/.config/tmux/session-manager.sh save"'
set-hook -g session-closed 'run -b "~/.config/tmux/session-manager.sh save"'

if -F "#{==:#{window_panes},1}" "set pane-border-status off" "set pane-border-status top"
set-hook -ga window-layout-changed 'if -F "#{==:#{window_panes},1}" "set pane-border-status off" "set pane-border-status top"'

set -g status-interval 3
set -g focus-events on
# Terminal.app never reports theme changes, so re-read its background (via a resize) when it regains focus,
# letting tmux notify panes (e.g. Claude Code's auto theme) after a light/dark switch
set-hook -g client-focus-in 'run -b "kill -WINCH #{client_pid}"'
# Terminal NoPad (bin/terminal-nopad) does report them (mode 2031): re-read right away
set-hook -g client-light-theme 'run -b "kill -WINCH #{client_pid}"'
set-hook -g client-dark-theme 'run -b "kill -WINCH #{client_pid}"'
set -g mouse off

# Theme — terminal ANSI colours instead of tmux's builtin light/dark palette
set -s theme terminal

# Status bar — transparent background, inherits terminal colors
set -g status-style "fg=default,bg=default"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Left: session name, reversed while prefix is pending, underlined in copy mode
set -g status-left "#{?client_prefix,#[reverse],#{?pane_in_mode,#[underscore],}}#[bold]#S#[default] "

# Window tabs
set -g window-status-format "#[dim]#I:#{?@remote_host,remote #{@remote_host},#{b:pane_current_path}} #[nodim]"
set -g window-status-current-format "#[bold]#I:#{?@remote_host,remote #{@remote_host},#{b:pane_current_path}} #[nobold]"
set -g window-status-separator ""
set -g window-status-current-style "default"
set -g window-status-activity-style "bold,underscore"
set -g window-status-bell-style "bold,underscore"

# Pane borders — subtle grey picked per client theme (attributes like dim are ignored on borders), active slightly stronger
set -g pane-border-style "#{?#{==:#{client_theme},light},fg=gray93,fg=gray14}"
set -g pane-active-border-style "#{?#{==:#{client_theme},light},fg=gray85,fg=gray22}"
set -g pane-border-lines single
set -g pane-border-format "#{?pane_active,#[fg=brightblack reverse],#[fg=brightblack dim]} #{pane_index}:#{?@remote_host,remote #{@remote_host},#{?#{!=:#{pane_title},#{host}},#{pane_title},#{pane_current_command}}}#{?window_zoomed_flag, 󰊓,} #[default]"

set -g pane-scrollbars off

# Unused window areas, menus, popups and mode borders — transparent
set -g fill-character " "
set -g menu-style "fg=default,bg=default"
set -g menu-selected-style "fg=default,bg=default,reverse"
set -g menu-border-style "fg=default,bg=default,dim"
set -g popup-style "fg=default,bg=default"
set -g popup-border-style "fg=default,bg=default,dim"
set -g tree-mode-border-style "fg=default,bg=default,dim"
set -g display-panes-border-style "fg=default,bg=default,dim"
set -g switch-mode-match-style "fg=default,bg=default,bold"

# Messages
set -g message-style "fg=default,bg=default,fill=terminal,bold"
set -g message-command-style "fg=default,bg=default,fill=terminal,bold"

# Copy/search mode
set -g mode-style "fg=default,bg=default,reverse"
set -g copy-mode-match-style "fg=default,bg=default,underscore,dim"
set -g copy-mode-current-match-style "fg=default,bg=default,reverse,dim"
set -g copy-mode-mark-style "fg=default,bg=default,bold,underscore"

# Clock
set -g clock-mode-style 24-with-seconds

# Display pane numbers
set -g display-panes-active-colour default
set -g display-panes-colour colour8

# Right: git branch in repo
set -g status-right "#{?@remote_host,,#(cd #{pane_current_path} && git rev-parse --is-inside-work-tree >/dev/null 2>&1 && echo \" \$(git branch --show-current) \" || echo \"\")}"

# Undercurl and sixel
set -g default-terminal "${TERM}"
set -g allow-passthrough on
set -as terminal-features ',*:sixel:usstyle'  # sixel images + undercurl/underline-colour (Smulx/Setulc)


set -g renumber-windows on
set -s escape-time 0
set -g history-limit 100000
set -g mode-keys vi

set -g set-titles on
set -g set-titles-string '#S'
set -g display-time 1000

set -g base-index 1
setw -g pane-base-index 1

bind C-b send-prefix

bind '"' if -F "#{@remote_host}" "run '~/.config/tmux/remote.sh split #{pane_id} -v'" "split-window -v -c '#{pane_current_path}'"
bind '%' if -F "#{@remote_host}" "run '~/.config/tmux/remote.sh split #{pane_id} -h'" "split-window -h -c '#{pane_current_path}'"
# New window with a remote pane, splits of a remote pane stay on its host (remote.sh)
bind S command-prompt -p "ssh host:" "run '~/.config/tmux/remote.sh new-window #{window_id} %%'"
# Floating pane that stays above a zoomed pane instead of unzooming it
bind -N 'New floating pane' * new-pane -A

bind h select-pane -L -Z
bind j select-pane -D -Z
bind k select-pane -U -Z
bind l select-pane -R -Z

# Navigate between panes
bind -n M-h select-pane -L -Z
bind -n M-j select-pane -D -Z
bind -n M-k select-pane -U -Z
bind -n M-l select-pane -R -Z
bind -n M-` select-pane -l -Z
bind -n M-F resize-pane -Z

bind -n M-| switch-client -l
bind -n M-p switch-client -p
bind -n M-n switch-client -n
bind -n M-Tab select-window -t :+
bind -n M-BTab select-window -t :-

bind -n M-K resize-pane -U
bind -n M-J resize-pane -D
bind -n M-H resize-pane -L
bind -n M-L resize-pane -R

bind C-l clear-history
bind C-s run "~/.config/tmux/session-manager.sh save" \; display "Session saved"
bind C-r run "~/.config/tmux/session-manager.sh restore" \; display "Session restored"

# Alt-<n> to switch to window <n>
run "for idx in $(seq 1 9); do tmux bind -n M-\$idx select-pane -t \$idx -Z; done"
# Ctr-b <n> to switch to pane <n>
run "for idx in $(seq 1 9); do tmux bind -T prefix \$idx select-window -t \$idx; done"

bind e run "cut -c3- ~/.config/tmux/tmux.conf | sh -s edit_tmux_output"

# Clipboard
# Accept OSC 52 from panes (remote panes' copies, remote.sh) and pass them to the macOS clipboard
set -s set-clipboard on
set-hook -g pane-set-clipboard 'run -b "tmux save-buffer - | pbcopy"'
# Remote panes: copy-mode of the remote tmux, which has the scrollback
bind [ if -F "#{@remote_host}" "run -b '~/.config/tmux/remote.sh copy-mode #{pane_id}'" copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi R send-keys -X refresh-toggle

bind b last-window
bind R source ~/.config/tmux/tmux.conf
bind ! confirm-before -p "kill-server? (y/n)" kill-server

bind -T root F12 {
  set prefix None
  set key-table off
  set -g status off
  if -F '#{pane_in_mode}' 'send-keys -X cancel'
  refresh-client -S
}

bind -T off F12 {
  set -u prefix
  set -u key-table
  set -g status on
  refresh-client -S
}

